name: alos-integration

services:
  backend:
    build:
      context: ../../../alos-backend
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    command: ["sh", "-c", "alembic upgrade head && uvicorn alos.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      GENESIS_BASE_URL: http://genesis:8100
      GENESIS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?}
      ALOS_CONTRACTS_PATH: /contracts
      ENABLE_TEST_TOOLS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "127.0.0.1:${ALOS_BACKEND_PORT:-8000}:8000"
    networks: [internal, data]
    volumes:
      - ../../../alos-contracts:/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  genesis:
    build:
      context: ../../../genesis-ai
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    environment:
      APP_ENV: development
      ALOS_BACKEND_BASE_URL: http://backend:8000
      ALOS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?}
      ALOS_CONTRACTS_PATH: /contracts
      ENABLE_TEST_RUNTIME: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    expose: ["8100"]
    networks: [internal]
    volumes:
      - ../../../alos-contracts:/contracts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    expose: ["5432"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    expose: ["4317", "4318"]
    networks: [internal]
    volumes:
      - ../../observability/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro

networks:
  internal:
  data:
    internal: true
