name: alos-integration

services:
  web:
    build:
      context: ../../../alos-web
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
      args:
        NEXT_PUBLIC_ALOS_API_BASE_URL: http://127.0.0.1:${ALOS_BACKEND_PORT:-8000}
    environment:
      NEXT_PUBLIC_ALOS_API_BASE_URL: http://127.0.0.1:${ALOS_BACKEND_PORT:-8000}
      ALOS_BACKEND_INTERNAL_URL: http://backend:8000
      ALOS_SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${ALOS_WEB_PORT:-3000}:3000"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ../../../alos-backend
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    command: ["sh", "-c", "alembic upgrade head && uvicorn integration_backend:app --app-dir /integration --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      GENESIS_BASE_URL: http://genesis:8100
      GENESIS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?}
      ALOS_CONTRACTS_PATH: /contracts
      ENABLE_TEST_TOOLS: "true"
      ENABLE_TEST_REGISTRATION: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      EMAIL_PROVIDER: inmemory
      EMAIL_FROM_NAME: ALOS
    ports:
      - "127.0.0.1:${ALOS_BACKEND_PORT:-8000}:8000"
    networks: [edge, internal, data]
    volumes:
      - ../../../alos-contracts:/contracts:ro
      - ../../scripts/integration_backend.py:/integration/integration_backend.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  genesis:
    build:
      context: ../../../genesis-ai
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    environment:
      APP_ENV: development
      ALOS_BACKEND_BASE_URL: http://backend:8000
      ALOS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?}
      DEFAULT_MODEL_ROUTE: ${DEFAULT_MODEL_ROUTE:-disabled}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-http://103.93.135.49:20128/v1}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_TIMEOUT_SECONDS: ${NINE_ROUTER_TIMEOUT_SECONDS:-10}
      NINE_ROUTER_MODEL_DEFAULT: ${NINE_ROUTER_MODEL_DEFAULT:-}
      NINE_ROUTER_MODEL_FAST: ${NINE_ROUTER_MODEL_FAST:-}
      NINE_ROUTER_MODEL_STANDARD: ${NINE_ROUTER_MODEL_STANDARD:-}
      NINE_ROUTER_MODEL_REASONING: ${NINE_ROUTER_MODEL_REASONING:-}
      NINE_ROUTER_MODEL_CODING: ${NINE_ROUTER_MODEL_CODING:-}
      NINE_ROUTER_MODEL_CRITICAL: ${NINE_ROUTER_MODEL_CRITICAL:-}
      NINE_ROUTER_MAXIMUM_CLASSIFICATION: ${NINE_ROUTER_MAXIMUM_CLASSIFICATION:-INTERNAL}
      ALOS_CONTRACTS_PATH: /contracts
      ENABLE_TEST_RUNTIME: "true"
    expose: ["8100"]
    networks: [internal]
    volumes:
      - ../../../alos-contracts:/contracts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    expose: ["5432"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol/config.yaml"]
    expose: ["4317", "4318"]
    networks: [internal]
    volumes:
      - ../../observability/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro

networks:
  edge:
  internal:
    internal: true
  data:
    internal: true
