name: alos-production

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    environment:
      WEB_HOSTNAME: ${WEB_HOSTNAME:?WEB_HOSTNAME wajib diisi}
      API_HOSTNAME: ${API_HOSTNAME:?API_HOSTNAME wajib diisi}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [edge]
    volumes:
      - ../../reverse-proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always

  web:
    image: ${ALOS_WEB_IMAGE:?Gunakan immutable ALOS_WEB_IMAGE}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ALOS_API_BASE_URL: https://${API_HOSTNAME}
    expose: ["3000"]
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  backend:
    image: ${ALOS_BACKEND_IMAGE:?Gunakan immutable ALOS_BACKEND_IMAGE}
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENESIS_BASE_URL: http://genesis:8100
      GENESIS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?GENESIS_INTERNAL_TOKEN wajib diisi}
      OTEL_SERVICE_NAME: alos-backend-production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
    expose: ["8000"]
    networks: [edge, internal, data]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  genesis:
    image: ${GENESIS_IMAGE:?Gunakan immutable GENESIS_IMAGE}
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8100
      ALOS_BACKEND_BASE_URL: http://backend:8000
      ALOS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?GENESIS_INTERNAL_TOKEN wajib diisi}
      OTEL_SERVICE_NAME: genesis-ai-production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    expose: ["8100"]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    expose: ["5432"]
    networks: [data]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    stop_grace_period: 1m
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.135.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    expose: ["4317", "4318"]
    networks: [internal]
    volumes:
      - ../../observability/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    restart: always

networks:
  edge:
  internal:
    internal: true
  data:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
