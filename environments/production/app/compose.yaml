name: alos-production-app

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    environment:
      WEB_HOSTNAME: ${WEB_HOSTNAME:?WEB_HOSTNAME wajib diisi}
      API_HOSTNAME: ${API_HOSTNAME:?API_HOSTNAME wajib diisi}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [edge]
    volumes:
      - ../../../reverse-proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  web:
    image: ${ALOS_WEB_IMAGE:?Gunakan immutable ALOS_WEB_IMAGE}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ALOS_API_BASE_URL: "https://${API_HOSTNAME}"
      ALOS_BACKEND_INTERNAL_URL: "http://backend:8000"
    expose: ["3000"]
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  backend:
    image: ${ALOS_BACKEND_IMAGE:?Gunakan immutable ALOS_BACKEND_IMAGE}
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER wajib diisi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}@${DATABASE_PRIVATE_HOST:?DATABASE_PRIVATE_HOST wajib diisi}:${DATABASE_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB wajib diisi}}"
      GENESIS_BASE_URL: "${GENESIS_BASE_URL:-http://${GENESIS_PRIVATE_HOST:?GENESIS_PRIVATE_HOST wajib diisi}:${GENESIS_PORT:-8100}}"
      GENESIS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN:?GENESIS_INTERNAL_TOKEN wajib diisi}
      CORS_ALLOWED_ORIGINS: "https://${WEB_HOSTNAME:?WEB_HOSTNAME wajib diisi}"
      ALOS_CONTRACTS_PATH: /contracts
      OTEL_SERVICE_NAME: alos-backend-production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
    ports:
      - "${APP_PRIVATE_BIND_IP:?APP_PRIVATE_BIND_IP wajib diisi}:${ALOS_BACKEND_PORT:-8000}:8000"
    expose: ["8000"]
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

networks:
  edge:

volumes:
  caddy-data:
  caddy-config:
