name: alos-local

services:
  web:
    build:
      context: ../../../alos-web
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
      args:
        NEXT_PUBLIC_ALOS_API_BASE_URL: http://127.0.0.1:${ALOS_BACKEND_PORT:-8000}
    environment:
      NEXT_PUBLIC_ALOS_API_BASE_URL: http://127.0.0.1:${ALOS_BACKEND_PORT:-8000}
      ALOS_BACKEND_INTERNAL_URL: http://backend:8000
      ALOS_SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${ALOS_WEB_PORT:-3000}:3000"
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ../../../alos-backend
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    command: ["sh", "-c", "alembic upgrade head && uvicorn alos.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GENESIS_BASE_URL: http://genesis:8100
      GENESIS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${ALOS_WEB_PORT:-3000},http://localhost:${ALOS_WEB_PORT:-3000}
      ALOS_CONTRACTS_PATH: /contracts
      DOCUMENT_OBJECT_ROOT: /data/documents
      ENABLE_TEST_TOOLS: ${ENABLE_TEST_TOOLS:-false}
      OTEL_SERVICE_NAME: alos-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-support@andaraimperialhub.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ALOS}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-support@andaraimperialhub.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${ALOS_BACKEND_PORT:-8000}:8000"
    networks: [edge, internal, data]
    volumes:
      - document-objects:/data/documents
      - ../../../alos-contracts:/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  jobs-worker:
    build:
      context: ../../../alos-backend
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    command: ["python", "-m", "alos.jobs.runner"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALOS_CONTRACTS_PATH: /contracts
      DOCUMENT_OBJECT_ROOT: /data/documents
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-support@andaraimperialhub.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ALOS}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-support@andaraimperialhub.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    networks: [data, edge]
    volumes:
      - document-objects:/data/documents
      - ../../../alos-contracts:/contracts:ro
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  genesis:
    build:
      context: ../../../genesis-ai
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ../../../alos-contracts
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8100
      ALOS_BACKEND_BASE_URL: http://backend:8000
      ALOS_INTERNAL_TOKEN: ${GENESIS_INTERNAL_TOKEN}
      ENABLE_TEST_RUNTIME: ${ENABLE_TEST_RUNTIME:-false}
      DEFAULT_MODEL_ROUTE: ${DEFAULT_MODEL_ROUTE:-disabled}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_TIMEOUT_SECONDS: ${NINE_ROUTER_TIMEOUT_SECONDS:-10}
      NINE_ROUTER_MODEL_DEFAULT: ${NINE_ROUTER_MODEL_DEFAULT:-}
      NINE_ROUTER_MODEL_FAST: ${NINE_ROUTER_MODEL_FAST:-}
      NINE_ROUTER_MODEL_STANDARD: ${NINE_ROUTER_MODEL_STANDARD:-}
      NINE_ROUTER_MODEL_REASONING: ${NINE_ROUTER_MODEL_REASONING:-}
      NINE_ROUTER_MODEL_CODING: ${NINE_ROUTER_MODEL_CODING:-}
      NINE_ROUTER_MODEL_CRITICAL: ${NINE_ROUTER_MODEL_CRITICAL:-}
      NINE_ROUTER_MAXIMUM_CLASSIFICATION: ${NINE_ROUTER_MAXIMUM_CLASSIFICATION:-INTERNAL}
      ALOS_CONTRACTS_PATH: /contracts
      OTEL_SERVICE_NAME: genesis-ai
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    expose: ["8100"]
    networks: [internal, model-egress]
    volumes:
      - ../../../alos-contracts:/contracts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    build:
      context: ../../database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose: ["5432"]
    networks: [data]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config=/etc/otelcol/config.yaml"]
    expose: ["4317", "4318"]
    networks: [internal]
    volumes:
      - ../../observability/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

networks:
  model-egress:
    driver: bridge
  edge:
  internal:
    internal: true
  data:
    internal: true

volumes:
  postgres-data:
  document-objects:
