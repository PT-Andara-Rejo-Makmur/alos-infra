name: Validasi Infrastruktur

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

env:
  ALOS_WEB_IMAGE: example.invalid/alos-web:validation
  ALOS_BACKEND_IMAGE: example.invalid/alos-backend:validation
  GENESIS_IMAGE: example.invalid/genesis-ai:validation
  POSTGRES_DB: alos_validation
  POSTGRES_USER: alos_validation
  POSTGRES_PASSWORD: ci
  GENESIS_INTERNAL_TOKEN: ci
  ALOS_INTERNAL_TOKEN: ci
  WEB_HOSTNAME: web.example.invalid
  API_HOSTNAME: api.example.invalid
  DATABASE_PRIVATE_HOST: 10.0.0.3
  GENESIS_PRIVATE_HOST: 10.0.0.2
  ALOS_BACKEND_BASE_URL: http://10.0.0.1:8000
  APP_PRIVATE_BIND_IP: 10.0.0.1
  GENESIS_BIND_IP: 10.0.0.2
  POSTGRES_BIND_IP: 10.0.0.3

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/alos-infra
    steps:
      - name: Checkout Infra repository
        uses: actions/checkout@v4
        with:
          path: workspace/alos-infra

      - name: Checkout canonical contracts
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-contracts
          ref: main
          path: workspace/alos-contracts
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-backend
          ref: main
          path: workspace/alos-backend
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout GENESIS
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/genesis-ai
          ref: main
          path: workspace/genesis-ai
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Checkout Web
        uses: actions/checkout@v4
        with:
          repository: PT-Andara-Rejo-Makmur/alos-web
          ref: main
          path: workspace/alos-web
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}

      - name: Build H1 service images with canonical contracts
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag alos-backend:h1-validation \
            --build-context contracts=../alos-contracts \
            ../alos-backend
          docker buildx build --load \
            --tag genesis-ai:h1-validation \
            --build-context contracts=../alos-contracts \
            ../genesis-ai
          docker buildx build --load \
            --tag alos-web:h1-validation \
            --build-context contracts=../alos-contracts \
            --build-arg NEXT_PUBLIC_ALOS_API_BASE_URL=https://api.example.invalid \
            ../alos-web

      - name: Verify canonical contract artifact in runtime images
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python alos-backend:h1-validation -c \
            "from pathlib import Path; from alos.contracts import CanonicalContractCatalog; root=Path('/contracts'); CanonicalContractCatalog(root); assert (root/'VERSION').is_file()"
          docker run --rm --entrypoint python genesis-ai:h1-validation -c \
            "from pathlib import Path; from genesis.contracts import CanonicalContractCatalog; root=Path('/contracts'); CanonicalContractCatalog(root); assert (root/'VERSION').is_file()"

      - name: Validasi seluruh Compose file
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file environments/local/.env.example -f environments/local/compose.yaml config --quiet
          docker compose --env-file environments/staging/.env.example -f environments/staging/compose.yaml config --quiet
          docker compose --env-file environments/production/app/.env.example -f environments/production/app/compose.yaml config --quiet
          docker compose --env-file environments/production/genesis/.env.example -f environments/production/genesis/compose.yaml config --quiet
          docker compose --env-file environments/production/data/.env.example -f environments/production/data/compose.yaml config --quiet

      - name: Validasi topology network & regression 4 VPS
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-infra-topology.py

      - name: Validasi Caddyfile
        run: >-
          docker run --rm
          -e WEB_HOSTNAME=web.example.invalid
          -e API_HOSTNAME=api.example.invalid
          -v "$PWD/reverse-proxy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Validasi syntax script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/health-check.sh
          bash -n database/backup/backup.sh
          bash -n database/backup/retention.sh
          bash -n database/restore/restore.sh
          bash -n database/migration/migrate.sh
          pwsh -NoProfile -Command '$errors = @(); Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object { $tokens = $null; $parseErrors = $null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null; $errors += $parseErrors }; if ($errors.Count) { $errors | Format-List; exit 1 }'
          python3 -m py_compile scripts/verify-infra-topology.py scripts/preflight-check.py scripts/test-restore-proof.py

      - name: Uji automated restore proof pada disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-restore-proof.py

      - name: Validasi file dan boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -path ./.git -prune -o -type f -empty -print)"
          ! grep -Eiq 'genesis|8100' reverse-proxy/caddy/Caddyfile
          ! grep -RInE --exclude='.env.example' --exclude='*.md' --exclude-dir='.git' \
            '^[[:space:]]*(POSTGRES_PASSWORD|GENESIS_INTERNAL_TOKEN)=.+' .
          private_key_pattern='BEGIN .*PRIVATE'' KEY'
          ! grep -RIl --exclude-dir='.git' -- "$private_key_pattern" .

      - name: Pastikan CI tidak melakukan deployment
        run: test ! -e .github/workflows/deploy.yml
